name: Deploy quiz to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app syntax and chapter groups
        run: |
          node --check app.js
          node test/check-bank.cjs
          node test/check-explanations.cjs
          node test/check-themes.cjs
          node test/check-mobile-quiz.cjs
          node test/check-lc-case1.cjs
          node test/check-lc-all.cjs
          node test/check-lc-shipment-dates.cjs
          node test/check-lc-option-evidence.cjs
          node test/check-auto-next.cjs
          node --check speed-core.js
          node --check speed-entry.js
          node --check speed-training.js
          node test/check-speed-core.cjs
          node test/check-speed-isolation.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js questions.json chapter-groups.json explanations.json lc-case1.json lc-all-cases.json .nojekyll _site/
          mkdir -p _site/assets/lc
          cp assets/lc/*.jpg _site/assets/lc/
          node test/prepare-speed-site.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
