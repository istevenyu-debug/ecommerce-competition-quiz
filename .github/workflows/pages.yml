name: Deploy quiz to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check application syntax and question bank
        run: |
          node --check app.js
          node -e "const q=require('./questions.json'); if(q.length<400||q.some(x=>!x.id||!x.question||!Array.isArray(x.options)||x.options.length!==4||!Number.isInteger(x.answer)||x.answer<0||x.answer>3)) process.exit(1); console.log('Validated '+q.length+' questions')"
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js questions.json .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
