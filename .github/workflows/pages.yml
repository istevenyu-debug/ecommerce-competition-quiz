name: Deploy quiz to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app syntax and chapter groups
        run: |
          node --check app.js
          node test/check-bank.cjs
          node test/check-explanations.cjs
          node test/check-themes.cjs
          node test/check-mobile-quiz.cjs
          node test/check-lc-case1.cjs
          node test/check-auto-next.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js questions.json chapter-groups.json explanations.json lc-case1.json .nojekyll _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
