<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173659">
<title>電商比賽刷題 APP</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#243c53;background:#edf3f9}
*{box-sizing:border-box}body{max-width:860px;margin:0 auto;padding:20px 14px 60px}
header h1{font-size:clamp(1.35rem,4.3vw,2rem);margin:8px 0}header p{color:#62788b;margin:6px 0 20px}
#app{background:white;padding:clamp(18px,4vw,32px);border-radius:20px;box-shadow:0 10px 32px rgba(37,61,87,.09)}
h2{font-size:clamp(1.1rem,4vw,1.5rem);margin:12px 0 18px}.question{line-height:1.65;white-space:pre-wrap}
button,select{font:inherit;border-radius:10px;padding:11px 15px}
button{background:#245f9c;border:1px solid #245f9c;color:#fff;cursor:pointer;font-weight:600}
button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}
button.secondary{background:#eaf2fc;color:#24537f;border-color:#b9cde2}
select{width:100%;background:white;color:inherit;border:1px solid #b9cde2;margin:10px 0 18px}
label{font-weight:600}.muted,.footnote{color:#677f93;font-size:.91rem;line-height:1.7}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{color:#366aa0;font-size:.89rem;font-weight:700}.chip{background:#f0f6fc;color:#365d83;padding:6px 11px;border-radius:20px;font-size:.8rem}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}
.metrics>div{background:#f2f7fc;border-radius:12px;padding:13px 9px;text-align:center}.metrics strong{display:block;font-size:clamp(1rem,3vw,1.45rem)}.metrics small{display:block;color:#697f93;font-size:.77rem}
progress{width:100%;height:14px;accent-color:#347eb4}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 10px}.actions button{flex:1 1 145px}
.option{display:flex;align-items:flex-start;width:100%;gap:12px;text-align:left;margin:10px 0;background:#f5f9ff;color:#193a59;border:1.5px solid #c8daea;line-height:1.55;font-weight:500;white-space:pre-wrap}
.option.selected{background:#cfe6fc;border-color:#276ca8;outline:2px solid #a9cae7}
.letter{flex:0 0 30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e0eaf5;height:30px;font-weight:800}
.category{font-size:.86rem;color:#667f94}.setting{border-top:1px solid #e0eaf4;padding-top:14px;margin-top:24px}.setting input{accent-color:#267ab1}
.context{border:1px solid #e1d3ae;background:#fffbf0;border-radius:10px;padding:12px;margin:15px 0;line-height:1.6}
.context summary{cursor:pointer;font-weight:600}.review{padding:16px;margin:14px 0;border:1px solid #e1eaf3;border-radius:12px}
.review.correct{border-left:5px solid #339c73}.review.incorrect{border-left:5px solid #d58459}
.review h3{font-size:1rem;line-height:1.6}.right{font-weight:700;color:#22794e}.score{font-size:1.5em;color:#206b9a}
.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.91rem}th,td{border-bottom:1px solid #e0e9f2;text-align:left;padding:12px 8px}th{background:#f6f9fd;white-space:nowrap}
.notice{background:#f2f7fc;border-radius:12px;padding:6px 10px}
@media(max-width:480px){body{padding:12px 9px}.metrics{gap:5px}.metrics>div{padding:10px 4px}.actions button{flex-basis:100%}.nav button{flex-basis:40%}}
</style></head><body><header><h1>電商比賽刷題 APP</h1><p>國貿大會考 × 電子商務與跨境電商｜免登入・每卷 30 題</p></header>
<main id="app" aria-live="polite">正在載入題庫…</main>
<script src="./app.js" defer></script></body></html>
