<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183f65">
<title>電商比賽刷題 APP｜分章節練習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263b50;background:#edf3f9}
*{box-sizing:border-box}
body{max-width:890px;margin:0 auto;padding:18px 12px 60px}
header h1{font-size:clamp(1.4rem,4vw,2rem);margin:6px 0}
header p{color:#62798f;margin:4px 0 22px;line-height:1.55}
#app{background:#fff;padding:clamp(18px,3.5vw,32px);border-radius:20px;box-shadow:0 10px 32px rgba(37,61,87,.09)}
h2{font-size:clamp(1.2rem,3.6vw,1.55rem);margin:18px 0 14px}
h3{font-size:1.1rem}
p{line-height:1.65}
button,select{font:inherit;border-radius:11px;padding:11px 16px}
button{background:#245f9c;border:1px solid #245f9c;color:#fff;cursor:pointer;font-weight:600}
button:hover{filter:brightness(.96)}
button:focus-visible,select:focus-visible{outline:3px solid #65a9ed;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#eaf2fc;color:#24537f;border-color:#bad0e4}
.muted,.footnote{color:#617a8e;font-size:.92rem;line-height:1.65}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{color:#286ca4;font-size:.9rem;font-weight:700}
.chip{background:#eaf3fc;color:#285b85;padding:5px 11px;border-radius:24px;font-size:.8rem;white-space:nowrap}
.mode-card,.chapter-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;color:#203e5e;background:#f8fbff;border:1px solid #cdddea;border-radius:15px;padding:17px 38px 17px 17px;margin:12px 0;gap:5px;font-weight:500}
.mode-card:hover,.chapter-card:hover{background:#ebf5ff;border-color:#94bfde}
.mode-card.mixed{background:#f2f8fe}
.mode-title,.chapter-title{font-size:1.08rem;font-weight:750;line-height:1.55}
.mode-meta,.chapter-sub{font-size:.9rem;color:#52718d}
.mode-detail{font-size:.83rem;color:#687f93}
.mode-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:2rem;color:#83a7c5}
.chapter-grid{margin:18px 0}
.thin-track{background:#ddeaf5;border-radius:10px;width:100%;height:6px;overflow:hidden;margin-top:8px}
.thin-progress{background:#438bc0;display:block;height:100%;border-radius:10px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0 12px}
.metrics>div{background:#f0f6fc;border-radius:12px;padding:13px 8px;text-align:center}
.metrics strong{display:block;font-size:clamp(.97rem,3vw,1.45rem);white-space:nowrap}
.metrics small{display:block;color:#657e95;font-size:.78rem}
progress{width:100%;height:13px;accent-color:#327fb3}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 4px}
.actions button{flex:1 1 148px;min-height:44px}
.group-card{padding:18px;border:1px solid #cfdeec;background:#fbfdff;border-radius:14px;margin:16px 0}
.group-heading{display:flex;align-items:center;justify-content:space-between;gap:9px}
.group-heading strong{font-size:1.14rem}
.group-card p{margin:8px 0}
.group-card .actions{margin-top:16px}
.group-progress{font-size:.91rem}
.chapter-tools{margin:16px 0}
.chapter-tools button{width:100%}
.case-warning{margin:20px 0;padding:15px;background:#fff8e7;border:1px solid #e6c77a;border-radius:12px}
.case-warning p{margin:7px 0;font-size:.9rem}
.setting{border-top:1px solid #dfeaf4;padding-top:16px;margin:18px 0}
.setting input{accent-color:#2168a1;width:17px;height:17px;vertical-align:middle}
.mix-balance{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}
.mix-balance div{background:#eff6fd;padding:16px;border-radius:13px;display:flex;flex-direction:column;gap:5px}
.mix-balance strong{font-size:.94rem}
.mix-balance span{font-size:1.35rem;font-weight:750}
.resume-box{margin:21px 0;background:#f3f7fd;border:1px solid #c9deec;border-radius:12px;padding:14px}
.resume-box p{margin:5px 0 10px}
.section-title{margin-top:28px}
.category{color:#668198;font-size:.9rem}
.question{white-space:pre-wrap;line-height:1.72;margin-bottom:22px;overflow-wrap:anywhere}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px;margin:10px 0;background:#f6faff;border:1.5px solid #c8daea;color:#193a59;font-weight:500;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere}
.option.selected{background:#d4eafb;border-color:#3379b5;outline:2px solid #9bc7e8}
.letter{flex:0 0 31px;height:31px;display:flex;justify-content:center;align-items:center;border-radius:50%;background:#e3ecf8;font-weight:800}
.context{border:1px solid #e2cb8b;background:#fffbef;border-radius:11px;padding:12px;line-height:1.65;margin:14px 0}
.context summary{font-weight:700;cursor:pointer}
.review{border:1px solid #dfe8f0;border-radius:13px;padding:16px;margin:14px 0;overflow-wrap:anywhere}
.review.correct{border-left:5px solid #28916a}
.review.incorrect{border-left:5px solid #c77b4f}
.review h3{font-size:1rem;line-height:1.6}
.right{color:#1b7951;font-weight:750}
.score{font-size:1.5em;color:#1f6b9a}
.table-scroll{overflow-x:auto;margin:15px 0}
table{border-collapse:collapse;width:100%;font-size:.91rem}
th,td{border-bottom:1px solid #e0eaf3;text-align:left;padding:12px 8px}
th{background:#f4f8fc;white-space:nowrap}
@media(max-width:530px){
body{padding:10px 8px 60px}
#app{padding:17px 12px}
.mode-card,.chapter-card{padding:13px 36px 13px 12px}
.metrics{gap:5px}
.metrics>div{padding:9px 4px}
.mix-balance{grid-template-columns:1fr 1fr}
.actions button{flex-basis:100%}
.nav button{flex-basis:40%}
}
.auto-next-tip{margin:15px 0;padding:11px 14px;border-radius:10px;background:#eaf6ed;border:1px solid #9fd3ac;color:#155a35;font-size:.92rem;font-weight:700;line-height:1.65}
.student-explanation{margin-top:14px;border:1px solid #b9d2e7;border-radius:11px;background:#f5f9fe}
.student-explanation summary{padding:13px 15px;color:#1d5c91;font-weight:700;cursor:pointer}
.student-explanation[open] summary{border-bottom:1px solid #d6e4f0}
.explanation-content{padding:4px 15px 14px;line-height:1.8;overflow-wrap:anywhere}
.explanation-content h4{margin:14px 0 6px}
.explanation-content p{margin:9px 0}
.memory-tip{background:#e7f4ed;padding:11px 13px;border-radius:9px;color:#17533b}

/* Three soft, distinct theme colors. No explanations/warning styling is altered. */
.mode-card[data-source="trade"]{background:#edf5ff;border-color:#cedff6}
.mode-card[data-source="trade"]:hover{background:#e5f0ff;border-color:#a4c4eb}
.mode-card[data-source="ecom"]{background:#edf9f1;border-color:#cce7d5}
.mode-card[data-source="ecom"]:hover{background:#e4f5e9;border-color:#a7d5b6}
.mode-card.mixed{background:#f7f1ff;border-color:#ddcdec}
.mode-card.mixed:hover{background:#efe6fc;border-color:#c7b0e2}
#app[data-theme="trade"]{background:#f7fbff;border:1px solid #dae8fa}
#app[data-theme="ecom"]{background:#f6fcf8;border:1px solid #d7ebdd}
#app[data-theme="mixed"]{background:#fbf8ff;border:1px solid #e7def4}
#app[data-theme="trade"] .group-card,#app[data-theme="trade"] .chapter-card{background:#fcfdff;border-color:#d4e3f7}
#app[data-theme="ecom"] .group-card,#app[data-theme="ecom"] .chapter-card{background:#fcfefc;border-color:#d3e9d9}
#app[data-theme="mixed"] .group-card,#app[data-theme="mixed"] .chapter-card{background:#fefcff;border-color:#e6dcf2}
#app[data-theme="trade"] .chip{background:#e4effd;color:#245983}
#app[data-theme="ecom"] .chip{background:#e2f4e8;color:#245d3a}
#app[data-theme="mixed"] .chip{background:#efe5fb;color:#614682}
#app[data-theme="trade"] progress{accent-color:#538dbd}
#app[data-theme="ecom"] progress{accent-color:#55a87a}
#app[data-theme="mixed"] progress{accent-color:#9571bd}
#app[data-theme="ecom"] .option.selected{background:#dff2e7;border-color:#64ad83;outline-color:#b1dfbf}
#app[data-theme="mixed"] .option.selected{background:#efe4f9;border-color:#a588cf;outline-color:#dbcaef}
#app[data-theme="trade"] .option.selected{background:#deedfd;border-color:#75a6d0;outline-color:#bdd5ed}


/* The first exam scope chapter is present in the outline but not in the PDF's question bank. */
.chapter-card.chapter-unavailable,
.chapter-card.chapter-unavailable:hover{
  cursor:default;
  background:#f2f5f8!important;
  color:#506579;
  border:1px dashed #b9c7d4!important;
}
.chapter-unavailable .chapter-title{color:#506579}
.chapter-unavailable .chapter-sub{color:#687b8b}
@media (max-width:640px){
  /* Hide the FOUR-LINE site banner only while actively answering questions. */
  body.quiz-active{padding:0 0 30px;max-width:100%}
  body.quiz-active > header{display:none!important}
  body.quiz-active #app{
    min-height:100dvh;
    padding:max(14px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom));
    border-radius:0;
    box-shadow:none;
    border-left:0;
    border-right:0;
  }
  body.quiz-active #app .topline{gap:6px}
  body.quiz-active #app .eyebrow{font-size:.84rem;line-height:1.5}
  body.quiz-active #app .chip{font-size:.75rem}
  body.quiz-active #app .category{font-size:.78rem;margin:11px 0 5px}
  body.quiz-active #app .question{font-size:1.2rem;line-height:1.7;margin:12px 0 19px}
  body.quiz-active #app .option{
    font-size:1.07rem;
    min-height:60px;
    padding:15px 12px;
    margin:11px 0;
    line-height:1.6;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  body.quiz-active #app .option .letter{flex-basis:34px;height:34px}
  body.quiz-active #app .auto-next-tip{font-size:.85rem;padding:8px 10px;margin:13px 0}
}
/* Touchscreens must not carry over the previous question's hover tint. */
@media (hover:none), (pointer:coarse){
  body.quiz-active .option:hover{filter:none!important}
  body.quiz-active .option:not(.selected):hover{
    background:#f6faff!important;
    border-color:#c8daea!important;
    outline:none!important;
  }
  body.quiz-active .option:not(.selected):focus:not(:focus-visible){outline:none!important}
}


.case-one-entry{background:#edf7ff;border:1px solid #a9cbdf;border-radius:13px;padding:15px;margin:18px 0}
.case-one-entry p{font-size:.9rem;line-height:1.6;color:#42627a;margin:7px 0 12px}
.case-one-entry button{width:100%}
.lc-reference{background:#f6fbff;border:1px solid #bbd6e8;border-radius:12px;padding:12px;margin:12px 0 19px}
.lc-reference-heading{font-weight:750;color:#285571;line-height:1.5}
.lc-ref-hint{color:#536e83;font-size:.85rem;line-height:1.6;margin:7px 0 10px}
.lc-excerpts,.lc-document-body{display:grid;gap:8px}
.lc-field{background:white;border:1px solid #d5e6ef;border-radius:9px;padding:10px 11px}
.lc-field-title{font-size:.81rem;font-weight:750;color:#315f7f;margin-bottom:6px;overflow-wrap:anywhere}
.lc-field-text{font-size:.94rem;line-height:1.6;color:#233b4d;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,"Noto Sans TC",monospace}
.lc-full{border-top:1px solid #d5e4ed;margin-top:13px;padding-top:10px}
.lc-full > summary,.lc-document > summary{cursor:pointer;padding:10px 4px;font-weight:700;line-height:1.5;color:#295f86}
.lc-document{border-top:1px solid #dae7ee}
.lc-document-body{padding:7px 2px 13px}
@media(max-width:640px){.lc-reference{padding:10px}.lc-field-text{font-size:.9rem}}

</style>
</head>
<body>
<header><h1>電商比賽刷題 APP</h1><p>國貿大會考 × 電子商務與跨境電商｜依章節分組，每卷最多 30 題</p><p class="muted" style="font-size:.78rem;margin-top:-12px">版本 2026.10.16｜手機答題版面優化・500 題詳解</p></header>
<main id="app" aria-live="polite">正在載入完整題庫與章節分組…</main>
<script src="./app.js?v=20261016-lc-case1-refs1" defer></script>
</body></html>
